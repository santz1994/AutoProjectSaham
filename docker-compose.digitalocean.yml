# DigitalOcean Droplet Deployment — AutoSaham Trading Bot
# Optimized for s-1vcpu-1gb ($6/mo) — ultra-low-cost deployment
# Total RAM allocation: ~920MB (fits in 1GB Droplet with swap)
#
# RECOMMENDED: Use swap file for safety (see deploy_digitalocean.sh)
#
# Usage:
#   cp .env.example .env   # then edit .env with real values
#   docker compose -f docker-compose.digitalocean.yml up -d --build

version: "3.9"

services:
  # ─── PostgreSQL (ultra-light) ────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: autosaham
      POSTGRES_USER: ${POSTGRES_USER:-autosaham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M
    shm_size: 64m
    command: >
      postgres
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=30
        -c wal_buffers=2MB
        -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autosaham}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (minimal) ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Server (FastAPI + uvicorn) ──────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autosaham}:${POSTGRES_PASSWORD:-change_me_now}@postgres:5432/autosaham
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_CONCURRENCY: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/models
      - log_data:/app/logs
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── Certbot (Let's Encrypt SSL) ────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  model_data:
  log_data:
  certbot_certs:
  certbot_www:
