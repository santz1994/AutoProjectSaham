# DigitalOcean Droplet Deployment — AutoSaham Trading Bot
# Optimized for s-1vcpu-1gb ($6/mo) — ultra-low-cost deployment
# Total RAM allocation: ~920MB (fits in 1GB Droplet with swap)
#
# RECOMMENDED: Use swap file for safety (see deploy_digitalocean.sh)
#
# Usage:
#   cp .env.example .env   # then edit .env with real values
#   docker compose -f docker-compose.digitalocean.yml up -d --build

version: "3.9"

services:
  # ─── Redis (minimal) ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Server (FastAPI + uvicorn) ──────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_CONCURRENCY: 1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/models
      - log_data:/app/logs
      - user_data:/app/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend (React SPA via Nginx) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── Certbot (Let's Encrypt SSL) ────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  model_data:
  log_data:
  user_data:
  certbot_certs:
  certbot_www:
