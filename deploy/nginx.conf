# AutoSaham — Nginx Reverse Proxy (DigitalOcean / Generic VPS)
# Supports both HTTP-only (initial) and HTTPS (after certbot)

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Upstream definitions
upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream frontend_backend {
    server frontend:80;
}

# ─── HTTP Server (redirect to HTTPS when certs exist) ──
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (always accessible)
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # If SSL certs exist, redirect to HTTPS
    # During initial deploy (no certs yet), proxy normally
    location / {
        # Uncomment below 2 lines after SSL is set up:
        # return 301 https://$host$request_uri;

        # Default: proxy to frontend (used during initial setup)
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

