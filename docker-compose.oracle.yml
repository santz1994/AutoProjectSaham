# ==============================================================================
# AutoSaham — Oracle Cloud Free Tier (ARM64) Optimized Deployment
# 4 OCPU ARM, 24GB RAM, 200GB storage
# Usage: docker compose -f docker-compose.oracle.yml up -d
# ==============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: autosaham_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autosaham
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading_secure_pwd}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - autosaham
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autosaham_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - autosaham
    deploy:
      resources:
        limits:
          memory: 640M

  # ── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosaham_api
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      DATABASE_URL: "postgresql://trading:${DB_PASSWORD:-trading_secure_pwd}@postgres:5432/autosaham"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      AUTOSAHAM_STATE_REDIS_URL: "redis://redis:6379/2"
      AUTOSAHAM_STATE_REDIS_PRIMARY_NAMESPACES: "ai_regime_state,broker_connection,user_settings"
      AUTOSAHAM_STATE_REDIS_PRIMARY_SHADOW_SQLITE: "1"
      AUTOSAHAM_STATE_POSTGRES_URL: "postgresql://trading:${DB_PASSWORD:-trading_secure_pwd}@postgres:5432/autosaham"
      AUTOSAHAM_STATE_POSTGRES_AI_LOGS_ENABLED: "1"
      AUTOSAHAM_STATE_POSTGRES_AI_LOGS_SHADOW_SQLITE: "1"
      AUTH_EXPOSE_RESET_TOKEN: "0"
      TZ: Asia/Jakarta
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Broker credentials (set in .env)
      STOCKBIT_API_KEY: ${STOCKBIT_API_KEY}
      STOCKBIT_SECRET: ${STOCKBIT_SECRET}
      AJAIB_EMAIL: ${AJAIB_EMAIL}
      AJAIB_PASSWORD: ${AJAIB_PASSWORD}
      INDOPREMIER_USERNAME: ${INDOPREMIER_USERNAME}
      INDOPREMIER_PASSWORD: ${INDOPREMIER_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - autosaham
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Frontend (Vite preview / nginx) ─────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: autosaham_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --production=false && npm run build && npx serve -s dist -l 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      api:
        condition: service_started
    networks:
      - autosaham
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Reverse Proxy (replaces Kong — lighter) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: autosaham_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - autosaham
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  autosaham:
    driver: bridge